name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Tests need a real Craft install on Postgres, which the shared
# 1994limited/coding-standard workflow can't build, so this repo keeps its
# own jobs. Both still only call composer scripts, the same ones
# `composer ci` runs locally.

jobs:
  quality:
    name: Code style & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: sodium, pdo_pgsql, intl, gd, zip, bcmath, mbstring
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer ci:quality

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', craft: '4' }
          - { php: '8.4', craft: '4' }
          - { php: '8.2', craft: '5' }
          - { php: '8.4', craft: '5' }
          - { php: '8.5', craft: '5' }
    name: PHP ${{ matrix.php }} · Craft ${{ matrix.craft }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: craft
          POSTGRES_PASSWORD: craft
          POSTGRES_DB: craft
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, pdo_pgsql, intl, gd, zip, bcmath, mbstring
          coverage: none

      - name: Install the plugin's own dependencies
        working-directory: plugin
        run: |
          composer update --prefer-dist --no-interaction --no-progress

      - name: Build a Craft ${{ matrix.craft }} site with the plugin
        run: |
          composer create-project "craftcms/craft:^${{ matrix.craft }}.0" app --no-interaction --no-scripts --no-progress
          cd app
          composer config audit.block-insecure false
          composer config repositories.plugin '{"type": "path", "url": "../plugin", "options": {"symlink": true, "versions": {"porro/craft-connector": "0.1.0"}}}'
          composer config allow-plugins.craftcms/plugin-installer true
          composer require "craftcms/cms:^${{ matrix.craft }}.0" porro/craft-connector:0.1.0 --with-all-dependencies --no-interaction --no-progress
          cat > .env <<'ENV'
          CRAFT_ENVIRONMENT=production
          CRAFT_DB_DRIVER=pgsql
          CRAFT_DB_SERVER=127.0.0.1
          CRAFT_DB_PORT=5432
          CRAFT_DB_DATABASE=craft
          CRAFT_DB_USER=craft
          CRAFT_DB_PASSWORD=craft
          CRAFT_DB_SCHEMA=public
          PRIMARY_SITE_URL=https://craft.test
          ENV
          php craft setup/security-key
          php craft install --interactive=0 --username=admin --email=admin@example.com --password=ci-only-password --site-name=CI --site-url=https://craft.test --language=en-GB
          php craft plugin/install porro

      - name: Test
        working-directory: plugin
        env:
          CRAFT_PATH: ${{ github.workspace }}/app
          CRAFT_MAJOR: ${{ matrix.craft }}
        run: composer ci:test

      - name: Craft's logs, when the tests fail
        if: failure()
        run: tail -n 150 app/storage/logs/*.log || true
